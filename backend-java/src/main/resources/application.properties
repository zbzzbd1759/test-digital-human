server.port=3456

# LLM配置 - AI增强测试用例生成
# 设置为true启用AI增强（需要配置api.key）
llm.enabled=false
# OpenAI API密钥（也可通过环境变量LLM_API_KEY设置）
llm.api.key=${LLM_API_KEY:}
# API地址（支持OpenAI、Azure OpenAI、或其他兼容API）
llm.api.url=https://api.openai.com/v1/chat/completions
# 模型名称（gpt-4o, gpt-4o-mini, gpt-3.5-turbo等）
llm.model=gpt-4o-mini
