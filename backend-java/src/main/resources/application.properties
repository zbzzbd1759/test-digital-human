server.port=3456
spring.config.import=optional:file:./application-local.properties

# LLM配置 - 阿里云百炼 DashScope
# 设置为true启用AI增强（需要配置api.key）
llm.enabled=false
# 阿里云百炼API密钥（也可通过环境变量LLM_API_KEY设置）
# 获取方式: https://bailian.console.aliyun.com/ → API-KEY管理
llm.api.key=${LLM_API_KEY:}
# 模型名称（qwen-plus, qwen-turbo, qwen-max, qwen-long 等）
llm.model=qwen-plus
