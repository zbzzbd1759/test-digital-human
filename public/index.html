<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试数字人</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px 32px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .topbar .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .topbar h1 { font-size: 20px; font-weight: 600; }
    .topbar .subtitle { font-size: 13px; color: #888; }

    .main { flex: 1; display: flex; }

    .sidebar { width: 280px; background: #12121f; border-right: 1px solid rgba(255,255,255,0.06); padding: 24px 0; flex-shrink: 0; }
    .step-list { list-style: none; }
    .step-item { padding: 14px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s; border-left: 3px solid transparent; }
    .step-item:hover { background: rgba(102,126,234,0.05); }
    .step-item.active { background: rgba(102,126,234,0.1); border-left-color: #667eea; }
    .step-item.done { opacity: 0.6; }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: #2a2a3e; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .step-item.active .step-num { background: #667eea; color: white; }
    .step-item.done .step-num { background: #10b981; color: white; }
    .step-label { font-size: 14px; }

    .content { flex: 1; padding: 32px; overflow-y: auto; }

    .panel { display: none; }
    .panel.active { display: block; }

    .input-area { max-width: 640px; }
    .input-area label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #aaa; }
    .input-area input, .input-area textarea { width: 100%; padding: 12px 16px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; color: #e0e0e0; font-size: 14px; margin-bottom: 16px; transition: border-color 0.2s; }
    .input-area input:focus, .input-area textarea:focus { outline: none; border-color: #667eea; }
    .input-area textarea { min-height: 80px; resize: vertical; }

    .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: #2a2a3e; color: #ccc; }
    .btn-secondary:hover { background: #3a3a4e; }

    .btn-group { display: flex; gap: 12px; margin-top: 8px; }

    .case-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .case-table th, .case-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
    .case-table th { background: rgba(102,126,234,0.08); color: #aaa; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    .case-table tr:hover { background: rgba(255,255,255,0.02); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-p0 { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-p1 { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-p2 { background: rgba(102,126,234,0.15); color: #818cf8; }
    .badge-passed { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-failed { background: rgba(239,68,68,0.15); color: #f87171; }

    .script-view { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: 16px; margin-top: 16px; max-height: 400px; overflow-y: auto; }
    .script-view pre { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.6; color: #a5b4fc; white-space: pre-wrap; word-break: break-all; }

    .result-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 20px 0; }
    .result-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 10px; padding: 20px; text-align: center; }
    .result-card .num { font-size: 36px; font-weight: 700; }
    .result-card .lbl { font-size: 12px; color: #888; margin-top: 4px; }
    .result-card.good .num { color: #10b981; }
    .result-card.bad .num { color: #ef4444; }
    .result-card.info .num { color: #667eea; }

    .progress-wrap { margin: 16px 0; }
    .progress-bar { height: 10px; background: #2a2a3e; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }

    .loading { display: flex; align-items: center; gap: 12px; padding: 20px; color: #888; }
    .spinner { width: 20px; height: 20px; border: 2px solid #2a2a3e; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .report-link { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 16px; transition: opacity 0.2s; }
    .report-link:hover { opacity: 0.9; }

    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .section-desc { font-size: 14px; color: #888; margin-bottom: 20px; }

    .empty-state { text-align: center; padding: 40px; color: #555; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="logo">T</div>
      <div>
        <h1>测试数字人</h1>
        <div class="subtitle">输入功能点 → 生成用例 → 执行测试 → 输出报告</div>
      </div>
    </div>

    <div class="main">
      <div class="sidebar">
        <ul class="step-list">
          <li class="step-item active" data-step="1" onclick="goStep(1)">
            <div class="step-num">1</div>
            <div class="step-label">输入功能点</div>
          </li>
          <li class="step-item" data-step="2" onclick="goStep(2)">
            <div class="step-num">2</div>
            <div class="step-label">查看测试用例</div>
          </li>
          <li class="step-item" data-step="3" onclick="goStep(3)">
            <div class="step-num">3</div>
            <div class="step-label">生成 & 执行脚本</div>
          </li>
          <li class="step-item" data-step="4" onclick="goStep(4)">
            <div class="step-num">4</div>
            <div class="step-label">测试报告</div>
          </li>
        </ul>
      </div>

      <div class="content">
        <!-- Step 1: 输入功能点 -->
        <div class="panel active" id="panel-1">
          <div class="input-area">
            <div class="section-title">输入你要测试的功能点</div>
            <div class="section-desc">描述你要测试的功能，系统会自动生成测试用例和执行脚本</div>

            <label>功能点描述</label>
            <textarea id="featureInput" placeholder="例如：用户登录功能，包含用户名密码输入和提交按钮">用户登录功能</textarea>

            <label>目标页面 URL（可选，默认使用内置示例应用）</label>
            <input type="text" id="targetUrl" placeholder="http://localhost:3456/sample-app/index.html">

            <div class="btn-group">
              <button class="btn btn-primary" onclick="generateCases()">生成测试用例</button>
              <button class="btn btn-secondary" onclick="runFullPipeline()">一键全流程</button>
            </div>
          </div>
        </div>

        <!-- Step 2: 测试用例 -->
        <div class="panel" id="panel-2">
          <div class="section-title">生成的测试用例</div>
          <div class="section-desc" id="caseSummary"></div>
          <div id="caseContent"></div>
          <div class="btn-group" style="margin-top:20px">
            <button class="btn btn-primary" onclick="generateAndRunScripts()">生成脚本并执行</button>
            <button class="btn btn-secondary" onclick="goStep(1)">返回修改</button>
          </div>
        </div>

        <!-- Step 3: 脚本执行 -->
        <div class="panel" id="panel-3">
          <div class="section-title">脚本生成 & 执行</div>
          <div id="scriptStatus"></div>
          <div id="scriptContent"></div>
          <div class="btn-group" style="margin-top:20px">
            <button class="btn btn-primary" onclick="goStep(4)">查看报告</button>
          </div>
        </div>

        <!-- Step 4: 报告 -->
        <div class="panel" id="panel-4">
          <div class="section-title">测试报告</div>
          <div id="reportContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let testCases = [];
    let execResults = null;
    let featurePoint = '';
    let targetUrl = '';

    function goStep(n) {
      currentStep = n;
      document.querySelectorAll('.step-item').forEach(el => {
        const s = parseInt(el.dataset.step);
        el.classList.toggle('active', s === n);
      });
      document.querySelectorAll('.panel').forEach(el => {
        el.classList.toggle('active', el.id === `panel-${n}`);
      });
    }

    function markDone(n) {
      document.querySelector(`.step-item[data-step="${n}"]`).classList.add('done');
    }

    async function generateCases() {
      featurePoint = document.getElementById('featureInput').value.trim();
      targetUrl = document.getElementById('targetUrl').value.trim();
      if (!featurePoint) return alert('请输入功能点描述');

      const res = await fetch('/api/generate-cases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ featurePoint, targetUrl: targetUrl || undefined })
      });
      const data = await res.json();
      testCases = data.cases;
      renderCases();
      markDone(1);
      goStep(2);
    }

    function renderCases() {
      document.getElementById('caseSummary').textContent = `共生成 ${testCases.length} 个测试用例`;
      const priorityBadge = p => `<span class="badge badge-${p.toLowerCase()}">${p}</span>`;
      let html = `<table class="case-table"><thead><tr>
        <th>编号</th><th>用例名称</th><th>分类</th><th>优先级</th><th>预期结果</th>
      </tr></thead><tbody>`;
      for (const tc of testCases) {
        html += `<tr>
          <td>${tc.id}</td>
          <td>${tc.name}</td>
          <td>${tc.category}</td>
          <td>${priorityBadge(tc.priority)}</td>
          <td>${tc.expected}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('caseContent').innerHTML = html;
    }

    async function generateAndRunScripts() {
      goStep(3);
      const statusEl = document.getElementById('scriptStatus');
      statusEl.innerHTML = '<div class="loading"><div class="spinner"></div>正在生成测试脚本...</div>';

      try {
        const genRes = await fetch('/api/generate-scripts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cases: testCases, targetUrl: targetUrl || undefined })
        });
        const genData = await genRes.json();

        statusEl.innerHTML = '<div class="loading"><div class="spinner"></div>正在执行测试脚本...</div>';
        document.getElementById('scriptContent').innerHTML =
          `<div class="section-title" style="margin-top:20px">生成的脚本</div><div class="script-view"><pre>${escapeHtml(genData.content)}</pre></div>`;

        const execRes = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scriptFile: genData.file, targetUrl: targetUrl || undefined })
        });
        execResults = await execRes.json();

        statusEl.innerHTML = '<div style="color:#10b981;padding:12px 0">测试执行完成!</div>';
        renderResults();
        markDone(2);
        markDone(3);

        await generateReport();
      } catch (e) {
        statusEl.innerHTML = `<div style="color:#ef4444;padding:12px 0">执行出错: ${e.message}</div>`;
      }
    }

    function renderResults() {
      if (!execResults) return;
      const { summary, results } = execResults;
      const passRate = summary.total > 0 ? ((summary.passed / summary.total) * 100).toFixed(1) : 0;

      let html = `<div class="result-cards">
        <div class="result-card info"><div class="num">${summary.total}</div><div class="lbl">总用例</div></div>
        <div class="result-card good"><div class="num">${summary.passed}</div><div class="lbl">通过</div></div>
        <div class="result-card bad"><div class="num">${summary.failed}</div><div class="lbl">失败</div></div>
        <div class="result-card info"><div class="num">${passRate}%</div><div class="lbl">通过率</div></div>
      </div>`;

      html += `<table class="case-table"><thead><tr>
        <th>编号</th><th>用例</th><th>状态</th><th>耗时</th><th>详情</th>
      </tr></thead><tbody>`;
      for (const r of results) {
        const badge = r.status === 'passed'
          ? '<span class="badge badge-passed">通过</span>'
          : '<span class="badge badge-failed">失败</span>';
        html += `<tr><td>${r.id}</td><td>${r.name}</td><td>${badge}</td><td>${r.duration ? r.duration + 'ms' : '-'}</td><td>${r.details || ''}</td></tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('scriptContent').innerHTML += html;
    }

    async function generateReport() {
      const res = await fetch('/api/generate-report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ results: execResults, featurePoint })
      });
      const report = await res.json();
      markDone(3);
      goStep(4);

      const { summary, passRate } = report;
      const progressClass = passRate >= 80 ? '#10b981' : passRate >= 50 ? '#f59e0b' : '#ef4444';

      document.getElementById('reportContent').innerHTML = `
        <div class="result-cards">
          <div class="result-card info"><div class="num">${summary.total}</div><div class="lbl">总用例</div></div>
          <div class="result-card good"><div class="num">${summary.passed}</div><div class="lbl">通过</div></div>
          <div class="result-card bad"><div class="num">${summary.failed}</div><div class="lbl">失败</div></div>
          <div class="result-card info"><div class="num">${passRate}%</div><div class="lbl">通过率</div></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" style="width:${passRate}%;background:${progressClass}"></div>
          </div>
        </div>
        <a class="report-link" href="${report.url}" target="_blank">查看完整 HTML 报告</a>
      `;
    }

    async function runFullPipeline() {
      featurePoint = document.getElementById('featureInput').value.trim();
      targetUrl = document.getElementById('targetUrl').value.trim();
      if (!featurePoint) return alert('请输入功能点描述');

      goStep(3);
      document.getElementById('scriptStatus').innerHTML = '<div class="loading"><div class="spinner"></div>正在执行全流程测试...</div>';
      document.getElementById('scriptContent').innerHTML = '';

      try {
        const res = await fetch('/api/run-full', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ featurePoint, targetUrl: targetUrl || undefined })
        });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        testCases = data.cases;
        execResults = data.execResults;

        document.getElementById('scriptStatus').innerHTML = '<div style="color:#10b981;padding:12px 0">全流程执行完成!</div>';
        document.getElementById('scriptContent').innerHTML =
          `<div class="section-title">生成的脚本</div><div class="script-view"><pre>${escapeHtml(data.scriptContent)}</pre></div>`;

        renderResults();
        markDone(1);
        markDone(2);
        markDone(3);

        const reportRes = await fetch('/api/generate-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ results: execResults, featurePoint })
        });
        const report = await reportRes.json();
        const passRate = report.passRate;
        const progressClass = passRate >= 80 ? '#10b981' : passRate >= 50 ? '#f59e0b' : '#ef4444';

        goStep(4);
        document.getElementById('reportContent').innerHTML = `
          <div class="result-cards">
            <div class="result-card info"><div class="num">${report.summary.total}</div><div class="lbl">总用例</div></div>
            <div class="result-card good"><div class="num">${report.summary.passed}</div><div class="lbl">通过</div></div>
            <div class="result-card bad"><div class="num">${report.summary.failed}</div><div class="lbl">失败</div></div>
            <div class="result-card info"><div class="num">${passRate}%</div><div class="lbl">通过率</div></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill" style="width:${passRate}%;background:${progressClass}"></div>
            </div>
          </div>
          <a class="report-link" href="${report.url}" target="_blank">查看完整 HTML 报告</a>
        `;
      } catch (e) {
        document.getElementById('scriptStatus').innerHTML = `<div style="color:#ef4444;padding:12px 0">执行出错: ${e.message}</div>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
