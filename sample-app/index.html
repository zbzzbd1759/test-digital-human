<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例应用 - 用户登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
    .login-card h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a2e; }
    .login-card p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .message { margin-top: 16px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
    .message.success { display: block; background: #d1fae5; color: #065f46; }
    .message.error { display: block; background: #fee2e2; color: #991b1b; }
    .counter { margin-top: 20px; text-align: center; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>用户登录</h1>
    <p>请输入您的账号和密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码">
      </div>
      <button type="submit" class="btn">登 录</button>
    </form>
    <div id="message" class="message"></div>
    <div class="counter">点击次数: <span id="clickCount">0</span></div>
  </div>

  <script>
    let clickCount = 0;
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');
    const clickCountEl = document.getElementById('clickCount');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      clickCount++;
      clickCountEl.textContent = clickCount;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username && !password) {
        showMessage('请输入用户名和密码', 'error');
        return;
      }
      if (!username) {
        showMessage('请输入用户名', 'error');
        return;
      }
      if (!password) {
        showMessage('请输入密码', 'error');
        return;
      }
      if (username === 'admin' && password === '123456') {
        showMessage('登录成功！欢迎回来，' + username, 'success');
      } else {
        showMessage('用户名或密码错误', 'error');
      }
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }
  </script>
</body>
</html>
